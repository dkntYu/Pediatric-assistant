<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b63"><title>兒科口袋助手 · 原型</title><link rel="stylesheet" href="style.css"></head>
<body><header><div class="brand"><span class="mark">＋</span><div>兒科口袋助手<small>PEDIATRIC POCKET</small></div></div><span class="badge">介面原型 · v0.1</span></header>
<main><section class="intro"><span class="eyebrow">為每一次查詢，少一步操作</span><h1>輸入基本資料，<br>快速找到需要的資訊。</h1><p>呼吸道、麻醉、急救與輸血，集中在一個畫面。</p></section>
<div class="notice"><strong>目前僅供操作預覽</strong><span>臨床公式、劑量與器材建議尚未載入；本版不產生臨床建議。</span></div>
<section class="panel patient"><div class="section-title"><h2><span>01</span> 基本資料</h2><button id="reset" class="text-button">清除資料</button></div><p class="label">年齡分類</p><div id="groups" class="segments" role="group" aria-label="年齡分類"></div><form id="patient-form" novalidate><div id="age-fields" class="fields"></div><div class="weight"><label for="weight">體重 <span>kg</span></label><input id="weight" type="number" inputmode="decimal" min="0.1" step="0.1" placeholder="例如 8.5" required><small>以公斤輸入，最多一位小數；資料僅用於本頁，不儲存。</small></div><p id="error" class="error" role="alert"></p><button class="primary" type="submit">套用資料 <span>→</span></button></form><div id="summary" class="summary" aria-live="polite">尚未套用基本資料</div></section>
<section class="lookup"><div class="section-title"><h2><span>02</span> 選擇查詢面向</h2><span class="muted">可隨時切換</span></div><div id="tabs" class="tabs" role="tablist" aria-label="查詢面向"></div><div class="search-row"><label class="search">⌕ <input id="search" type="search" aria-label="搜尋本分類項目" placeholder="搜尋本分類項目"></label><button id="favorites" class="filter" aria-pressed="false">☆ 常用</button></div><div id="results" role="tabpanel"></div></section>
<footer>資料狀態：待提供參考來源與逐項核對<br>離線模式尚未啟用 · 本版未儲存病人資料</footer></main><script src="app.js"></script></body></html>
