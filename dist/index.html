<main>
<div class="notice"><strong>開發預覽 · 尚未完成臨床驗收</strong><span>四區已加入來源參考與可用計算；受來源、年齡或製劑限制的項目會停用。尚未完成院內臨床驗收。</span></div>
<section class="panel patient"><div class="section-title"><h2><span>01</span> 基本資料</h2><button id="reset" class="text-button">清除資料</button></div><div class="patient-body"><p class="label">年齡分類</p><div id="groups" class="segments" role="group" aria-label="年齡分類"></div><form id="patient-form" novalidate><div id="age-fields" class="fields"></div><div class="weight"><label for="weight">體重 <span>kg</span></label><input id="weight" type="number" inputmode="decimal" min="0.1" max="200" step="0.1" placeholder="例如 8.5" required><details class="patient-help"><summary>輸入與記憶說明</summary><small>以公斤輸入，最多一位小數；<span id="remember-status">套用後會記住年齡與體重，僅儲存在此瀏覽器。</span></small></details></div><p id="error" class="error" role="alert"></p></form></div><div class="patient-actions"><button class="primary" type="submit" form="patient-form">套用資料 <span>→</span></button><div id="summary" class="summary" aria-live="polite">尚未套用基本資料</div></div></section>
<section class="lookup"><div class="section-title"><h2><span>02</span> 選擇查詢面向</h2><span class="muted">可隨時切換</span></div><div id="tabs" class="tabs" role="tablist" aria-label="查詢面向"></div><div class="search-row"><label class="search">⌕ <input id="search" type="search" aria-label="搜尋本分類項目" placeholder="搜尋本分類項目"></label><button id="favorites" class="filter" aria-pressed="false">☆ 常用</button></div><div id="results" role="tabpanel"></div></section>
