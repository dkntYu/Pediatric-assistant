<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b63"><meta name="apple-mobile-web-app-capable" content="yes"><title>兒科口袋助手 · 開發預覽</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="infusion.css"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"></head>
<body><header><div class="brand"><span class="mark">＋</span><div>兒科口袋助手<small>PEDIATRIC POCKET</small></div></div><span class="badge">計算機模式 · v0.4</span></header>
<main><section class="intro"><span class="eyebrow">為每一次查詢，少一步操作</span><h1>輸入基本資料，<br>快速找到需要的資訊。</h1><p>呼吸道、麻醉、急救、輸液與輸血，集中在一個畫面。</p></section>
<div class="notice"><strong>依輸入數值換算</strong><span>你輸入劑量、濃度與時間，工具計算用量和速率。參考資料另列，超出範圍只提示，不自動修改數值。</span></div>
<section class="panel patient"><div class="section-title"><h2><span>01</span> 基本資料</h2><button id="reset" class="text-button">清除資料</button></div><p class="label">年齡分類</p><div id="groups" class="segments" role="group" aria-label="年齡分類"></div><form id="patient-form" novalidate><div id="age-fields" class="fields"></div><div class="weight"><label for="weight">體重 <span>kg</span></label><input id="weight" type="number" inputmode="decimal" min="0.1" max="200" step="0.1" placeholder="例如 8.5" required><small>以公斤輸入，最多一位小數；資料僅用於本頁，不儲存。</small></div><p id="error" class="error" role="alert"></p><button class="primary" type="submit">套用資料 <span>→</span></button></form><div id="summary" class="summary" aria-live="polite">尚未套用基本資料</div></section>
<section class="lookup"><div class="section-title"><h2><span>02</span> 選擇查詢面向</h2><span class="muted">可隨時切換</span></div><div id="tabs" class="tabs" role="tablist" aria-label="查詢面向"></div><div class="search-row"><label class="search">⌕ <input id="search" type="search" aria-label="搜尋本分類項目" placeholder="搜尋本分類項目"></label><button id="favorites" class="filter" aria-pressed="false">☆ 常用</button></div><div id="results" role="tabpanel"></div></section>
<footer>資料查閱日期：2026-10-27 · 國外參考與臺灣藥品資料分別註明<br>本版未儲存病人資料<br><span id="offline-status" role="status">正在檢查離線檔案…</span><br><button id="check-update" class="text-button">檢查版本更新</button></footer></main><script src="infusion.js"></script><script src="clinical-data.js"></script><script src="clinical-core.js"></script><script src="clinical-ui.js"></script><script src="calculator.js"></script><script src="app-v3.js"></script><script src="offline.js"></script></body></html>
